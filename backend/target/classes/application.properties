# Server configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Active profile: defaults to h2 for instant out-of-the-box local run. Switch to 'postgres' with SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Spring Data JPA (common)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Rate Limiting configuration
security.rate-limit.login.max-attempts=5
security.rate-limit.login.duration-minutes=1
security.rate-limit.ai.max-requests-per-hour=100

# AI Microservice Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout-seconds=15
ai.reconciliation.confidence-threshold=0.7

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.aifinance=INFO
logging.level.org.springframework.security=INFO
